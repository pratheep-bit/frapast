name: frapAST Security Audit

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Frappe App Security & Quality Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frapAST & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

      - name: Run frapAST CLI Audit
        env:
          PYTHONPATH: .
        run: |
          python -m scanner.cli scan . --format human --limit 20
