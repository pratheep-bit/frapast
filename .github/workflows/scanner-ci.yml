name: Scanner Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linter (ruff)
        run: ruff check .

      - name: Run Unit Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest --cov=scanner --cov-report=term-missing --cov-report=xml -v

      - name: Validate Taxonomy Registry
        env:
          PYTHONPATH: .
        run: python scanner/validate_taxonomy.py

      - name: Validate Ledger Entries
        env:
          PYTHONPATH: .
        run: python scanner/validate_ledger.py

      - name: Verify Ledger Reproducer Hashes
        env:
          PYTHONPATH: .
        run: python scanner/verify_ledger_integrity.py

      - name: Validate Reproducer Markers
        env:
          PYTHONPATH: .
        run: python scanner/proof/validate_reproducer_markers.py

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  supply-chain-audit:
    name: Supply-Chain Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit frapAST Dependencies
        run: pip-audit --requirement <(pip install -e ".[dev]" --dry-run 2>&1 | grep "Would install" | sed 's/Would install //' | tr ' ' '\n' | sed 's/==/==/' || echo "pyyaml rich libcst")
        continue-on-error: true

      - name: Audit Direct Dependencies
        run: |
          pip install pyyaml rich libcst
          pip-audit
