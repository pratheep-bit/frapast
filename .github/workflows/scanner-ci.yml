name: Scanner Engine CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install libcst pyyaml ruff pytest

      - name: Run Python Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests/ -p "test_*.py"

      - name: Validate Taxonomy Registry
        env:
          PYTHONPATH: .
        run: python scanner/validate_taxonomy.py

      - name: Validate Ledger Entries
        env:
          PYTHONPATH: .
        run: python scanner/validate_ledger.py

      - name: Verify Ledger Reproducer Hashes
        env:
          PYTHONPATH: .
        run: python scanner/verify_ledger_integrity.py

      - name: Validate Reproducer Markers
        env:
          PYTHONPATH: .
        run: python scanner/proof/validate_reproducer_markers.py
