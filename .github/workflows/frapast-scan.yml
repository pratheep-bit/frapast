name: frapAST Security Action Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  action-test:
    name: Test Composite Action (action.yml)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run frapAST Composite Action
        uses: ./
        with:
          repo-path: 'tests/python/fixtures'
          fail-on: 'critical'
          format: 'sarif'
          sarif-file: 'frapast-results.sarif'
          upload-sarif: 'true'
