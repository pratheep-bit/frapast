rule_id: FR-SECRET-001
rule_version: 1.0.0
taxonomy_id: FR-SECRET-001
required_indexes: [python, callgraph]
predicate: >
  Sensitive field (password, api_secret, api_key, token, reset_password_key, etc.)
  written via frappe.db.set_value from a whitelisted endpoint without a permission guard —
  may allow unauthorized overwrite or leakage of credentials.
evidence_fields: [source_span, function, code_location_hash]
proof_recipe: >
  Invoke the endpoint as a low-privilege user attempting to write or read the
  sensitive field; verify the operation is rejected and the value is not echoed.
severity_defaults:
  privilege_required: "authenticated"
  impact_class: "account_takeover"
  blast_radius: "cross_user"
advisories:
  - GHSA-p284-r7rh-wq7j
  - GHSA-qrv3-jc3h-f3m6
  - GHSA-9c55-cq5r-qj5x
