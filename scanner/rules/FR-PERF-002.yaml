rule_id: FR-PERF-002
rule_version: 1.0.0
taxonomy_id: FR-PERF-002
required_indexes: [python, schema]
predicate: >
  Query or report filters or joins on a DocType field that lacks a database index
  (in_standard_filter, search_index, or db_index not enabled), triggering expensive
  full table scans on high-volume tables.
evidence_fields: [source_span, function, code_location_hash]
proof_recipe: >
  Inspect the DocType JSON schema for the queried field and add 'search_index: 1'
  or 'in_standard_filter: 1' to create a database index.
severity_defaults:
  privilege_required: "none"
  impact_class: "performance_degradation"
  blast_radius: "component"
advisories: []

