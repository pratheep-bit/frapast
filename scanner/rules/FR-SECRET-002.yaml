rule_id: FR-SECRET-002
rule_version: 1.0.0
taxonomy_id: FR-SECRET-002
required_indexes: [python]
predicate: >
  Hardcoded plaintext credential, secret key, private key, or committed configuration
  secret (site_config.json, common_site_config.json, .env, or Python source assignment)
  exposing database credentials, encryption keys, or third-party API tokens.
evidence_fields: [source_span, function, code_location_hash]
proof_recipe: >
  Verify if the credential is live or committed to version control; rotate the secret
  immediately and migrate credentials to external environment variables or runtime injection.
severity_defaults:
  privilege_required: "unauthenticated"
  impact_class: "credential_exposure"
  blast_radius: "system_wide"
advisories:
  - GHSA-p284-r7rh-wq7j

