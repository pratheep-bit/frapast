rule_id: FR-XSS-001
rule_version: 2.0.0
taxonomy_id: FR-XSS-001
required_indexes: [python, callgraph]
predicate: >
  User-controlled input is written to an HTML / rich-text field (description,
  message, content, notes, etc.) via db.set_value() or a direct attribute write
  from a whitelisted endpoint, without frappe.utils.sanitize_html() applied first.
  The stored value is later rendered unescaped inside print formats, email bodies,
  or custom web views, resulting in Stored XSS.
evidence_fields: [source_span, function, code_location_hash]
proof_recipe: >
  Set the HTML field to a payload such as <img src=x onerror=alert(document.domain)>
  via the whitelisted endpoint, then render the document in a print format or email
  template and verify the payload executes in the browser. Apply
  frappe.utils.sanitize_html() before persisting to remediate.
severity_defaults:
  privilege_required: "authenticated"
  impact_class: "xss"
  blast_radius: "cross_user"
