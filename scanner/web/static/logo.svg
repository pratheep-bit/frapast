<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Crisp Light Frost Gradient Background -->
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>

    <!-- Soft Ambient Aura -->
    <radialGradient id="apexAuraLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>

    <!-- Bold Obsidian Chevron Gradient -->
    <linearGradient id="chevronDarkGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Subtle Light Border Gradient -->
    <linearGradient id="borderLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Electric Cyan Particle Glow -->
    <radialGradient id="particleGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Indigo Particle Glow -->
    <radialGradient id="particleGlowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgLightGrad)"/>
  <rect width="512" height="512" rx="108" fill="url(#apexAuraLight)"/>
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="url(#borderLightGrad)" stroke-width="3"/>

  <!-- Subtle Constellation / Particle Grid -->
  <g opacity="0.75">
    <!-- Connecting constellation filaments -->
    <line x1="256" y1="136" x2="316" y2="88" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.45"/>
    <line x1="144" y1="368" x2="92" y2="318" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="368" y1="368" x2="420" y2="326" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.45"/>
    <line x1="256" y1="260" x2="256" y2="320" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.35"/>

    <!-- Small ambient particles -->
    <circle cx="108" cy="148" r="2.5" fill="#0284C7" opacity="0.6"/>
    <circle cx="400" cy="158" r="3" fill="#4F46E5" opacity="0.65"/>
    <circle cx="82" cy="240" r="2" fill="#64748B" opacity="0.5"/>
    <circle cx="434" cy="238" r="2.5" fill="#0284C7" opacity="0.6"/>
    <circle cx="160" cy="98" r="2" fill="#0F172A" opacity="0.4"/>
    <circle cx="352" cy="108" r="2" fill="#0284C7" opacity="0.5"/>
    <circle cx="206" cy="382" r="2.5" fill="#4F46E5" opacity="0.5"/>
    <circle cx="306" cy="382" r="2" fill="#0284C7" opacity="0.55"/>
  </g>

  <!-- Glowing Anchor Particle Orbitals -->
  <circle cx="316" cy="88" r="10" fill="url(#particleGlowCyan)"/>
  <circle cx="316" cy="88" r="4" fill="#0284C7"/>

  <circle cx="92" cy="318" r="9" fill="url(#particleGlowIndigo)"/>
  <circle cx="92" cy="318" r="3.5" fill="#4F46E5"/>

  <circle cx="420" cy="326" r="10" fill="url(#particleGlowCyan)"/>
  <circle cx="420" cy="326" r="4" fill="#0284C7"/>

  <circle cx="256" cy="320" r="8" fill="url(#particleGlowIndigo)"/>
  <circle cx="256" cy="320" r="3" fill="#6366F1"/>

  <!-- Core Geometric Λ Emblem (Bold Obsidian) -->
  <polyline points="144,368 256,136 368,368" fill="none" stroke="url(#chevronDarkGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Apex Radiant Particle -->
  <circle cx="256" cy="136" r="16" fill="url(#particleGlowCyan)" opacity="0.9"/>
  <circle cx="256" cy="136" r="6" fill="#0284C7"/>
  <circle cx="256" cy="136" r="2.5" fill="#FFFFFF"/>
</svg>
