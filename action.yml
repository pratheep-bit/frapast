name: 'frapAST Security Scanner'
description: 'Runtime-proven SAST scanner for Frappe & ERPNext apps'
author: 'pratheep-bit'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Path to Frappe app or repository to scan'
    required: false
    default: '.'
  fail-on-proven:
    description: 'Fail step if proven vulnerabilities are detected'
    required: false
    default: 'true'
  sarif:
    description: 'Output results in SARIF format for GitHub Security'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install frapAST Engine
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run frapAST Security Scan
      id: scan
      shell: bash
      run: |
        set +e
        echo "::group::frapAST Scan Execution"
        if [ "${{ inputs.sarif }}" = "true" ]; then
          frapast scan "${{ inputs.path }}" --format sarif > frapast-results.sarif
          scan_exit=$?
          jq -r '.runs[0].results[]? | "[\(.level)] \(.ruleId): \(.message.text)"' frapast-results.sarif 2>/dev/null || true
        else
          frapast scan "${{ inputs.path }}" --severity
          scan_exit=$?
        fi
        echo "::endgroup::"
        echo "exit_code=$scan_exit" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub Security
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: frapast-results.sarif
        category: frapast-security-scan
      continue-on-error: true

    - name: Enforce fail-on-proven
      shell: bash
      run: |
        exit_code="${{ steps.scan.outputs.exit_code }}"
        if [ "${{ inputs.fail-on-proven }}" = "true" ] && [ "$exit_code" != "0" ]; then
          echo "frapAST found proven vulnerabilities (exit code $exit_code). Failing per fail-on-proven=true."
          exit 1
        fi
        echo "Scan completed (exit code $exit_code). fail-on-proven=${{ inputs.fail-on-proven }}, not blocking."
