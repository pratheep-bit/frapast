name: "frapAST Security & Performance Audit"
description: "Autonomous, runtime-proven security, performance & compatibility audit for Frappe and ERPNext custom apps."
author: "Pratheep S"
branding:
  icon: "shield-check"
  color: "blue"

inputs:
  repo-path:
    description: "Path to repository or Frappe app directory to audit"
    required: false
    default: "."
  fail-on-critical:
    description: "Fail the CI step if critical findings are detected"
    required: false
    default: "true"
  format:
    description: "Output format: sarif, json, or human"
    required: false
    default: "sarif"
  sarif-file:
    description: "Path to output SARIF report"
    required: false
    default: "frapast-results.sarif"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

outputs:
  sarif-path:
    description: "Path to the generated SARIF report"
    value: ${{ inputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install frapAST
      shell: bash
      run: |
        pip install --upgrade pip
        pip install pyyaml rich libcst

    - name: Run frapAST Security Audit
      shell: bash
      run: |
        python -m scanner.cli scan "${{ inputs.repo-path }}" --format "${{ inputs.format }}" --sarif "${{ inputs.sarif-file }}" || true
        python -m scanner.cli scan "${{ inputs.repo-path }}" --limit 25

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.format == 'sarif' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
      continue-on-error: true
