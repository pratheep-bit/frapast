[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frapast"
version = "1.2.0"
description = "Runtime-Proven Static Security Analysis Engine for Frappe & ERPNext"
readme = "README.md"
authors = [
    { name = "Pratheep S", email = "pratheeps2024@gmail.com" }
]
license = "MIT"
keywords = ["frappe", "erpnext", "security", "sast", "static-analysis", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "libcst>=1.0.0",
]

[project.scripts]
frapast = "scanner.cli:main"

[project.entry-points."frappe.commands"]
frapast = "scanner.bench_commands:commands"

[project.urls]
Homepage = "https://github.com/pratheep-bit/frapast"
Repository = "https://github.com/pratheep-bit/frapast"
Issues = "https://github.com/pratheep-bit/frapast/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = [
    "taxonomy/*.yaml",
    "rules/*.yaml",
    "web/static/*",
]

[project.optional-dependencies]
# pip install frapast[shell]  — enables the interactive REPL with history/tab-completion
shell = ["prompt_toolkit>=3.0"]
# pip install frapast[dev]  — test and lint dependencies
dev  = ["pytest>=7.0", "ruff", "libcst>=1.0.0"]
